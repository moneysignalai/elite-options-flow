services:
  - type: web
    name: elite-options-flow-web
    env: python
    plan: starter
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash start_web.sh"
    envVars:
      - key: MASSIVE_API_KEY
        sync: false
      - key: SCAN_TICKERS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENABLE_POSTGRES
        value: "false"
      - key: ENABLE_PREMARKET
        value: "false"
      - key: ENABLE_AFTERHOURS
        value: "false"
    healthCheckPath: /health
    autoDeploy: true

  - type: worker
    name: elite-options-flow-worker
    env: python
    plan: starter
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash start_worker.sh"
    envVars:
      - key: MASSIVE_API_KEY
        sync: false
      - key: SCAN_TICKERS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENABLE_POSTGRES
        value: "false"
      - key: ENABLE_PREMARKET
        value: "false"
      - key: ENABLE_AFTERHOURS
        value: "false"
