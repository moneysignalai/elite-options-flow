services:
  - type: web
    name: elite-options-flow-web
    env: python
    runtime: python
    rootDir: .
    plan: starter
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=. python -m uvicorn src.main_web:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: ENV
        value: "prod"
      - key: LOG_LEVEL
        value: "INFO"
      - key: MASSIVE_BASE_URL
        value: "https://api.massive.com"
      - key: MASSIVE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SCAN_TICKERS
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  - type: worker
    name: elite-options-flow-worker
    env: python
    runtime: python
    rootDir: .
    plan: starter
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=. alembic upgrade head && PYTHONPATH=. python -m src.worker"
    envVars:
      - key: ENV
        value: "prod"
      - key: LOG_LEVEL
        value: "INFO"
      - key: MASSIVE_BASE_URL
        value: "https://api.massive.com"
      - key: MASSIVE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SCAN_TICKERS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
